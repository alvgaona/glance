# Conventional commits, the rules of @commitlint/config-conventional written out, so
# no npm install is needed (pixi's commitlint ships the CLI only).
# The preset's header parsing too: `feat!:` and `feat(scope)!:` mark breaking changes.
parserPreset:
  parserOpts:
    headerPattern: '^(\w*)(?:\((.*)\))?!?: (.*)$'
    breakingHeaderPattern: '^(\w*)(?:\((.*)\))?!: (.*)$'
    headerCorrespondence: [type, scope, subject]
    noteKeywords: [BREAKING CHANGE, BREAKING-CHANGE]
rules:
  type-enum:
    - 2
    - always
    - [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]
  type-case: [2, always, lower-case]
  type-empty: [2, never]
  scope-case: [2, always, lower-case]
  subject-empty: [2, never]
  subject-full-stop: [2, never, "."]
  subject-case: [2, never, [sentence-case, start-case, pascal-case, upper-case]]
  header-max-length: [2, always, 100]
  header-trim: [2, always]
  body-leading-blank: [1, always]
  body-max-line-length: [2, always, 100]
  footer-leading-blank: [1, always]
  footer-max-line-length: [2, always, 100]
