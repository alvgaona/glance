name: Idea
description: Something glance could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's awkward today
      description: The git task, and what makes it slow or confusing with plain git.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What glance could do
      description: Which command or screen, and roughly how it would work. Keys are welcome.
    validations:
      required: true
