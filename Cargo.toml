[package]
# `glance` is taken on crates.io as a crate name; the binary is still `glance`.
name = "glance-git"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A nicer view of git status, log and friends"
authors = ["Alvaro Gaona <alvgaona@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/alvgaona/glance"
homepage = "https://github.com/alvgaona/glance"
readme = "README.md"
keywords = ["git", "tui", "cli", "terminal", "staging"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".agents/", ".github/", "lefthook.yml", "pixi.toml", "pixi.lock", ".commitlintrc.yaml"]

# `cargo binstall glance-git` downloads the release tarball instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/glance-v{ version }-{ target }.tar.gz"
bin-dir = "glance-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
gix = { version = "0.90.0", default-features = false, features = ["status", "revision", "sha1", "blob-diff"] }
owo-colors = "4.4.0"
# rendered-line-info: Paragraph::line_count, to size dialogs to their wrapped text.
ratatui = { version = "0.30.2", optional = true, features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
unicode-width = "0.2.3"

[features]
default = ["tui"]
# Full-screen interactive views (log -i, rebase editor, branches with PR status from gh).
tui = ["dep:ratatui", "dep:crossterm", "dep:serde", "dep:serde_json"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
