# git-cliff: CHANGELOG.md and release notes from conventional commits.
# `pixi run changelog` rewrites CHANGELOG.md; the release workflow uses
# `git-cliff --latest --strip header` for one tag's notes.

[changelog]
header = """
# Changelog

All notable changes to glance are listed here, newest first.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/alvgaona/glance/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/alvgaona/glance/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Order of the sections; the HTML comments only sort them and are stripped.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|style|revert)", group = "<!-- 7 -->Other" },
]
tag_pattern = "v[0-9].*"
# A stable release lists everything since the last stable one.
ignore_tags = "-rc"
sort_commits = "newest"
